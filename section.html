<body>
    <div id="loadingScreen" style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
        <div style="text-align: center;">
            <div style="border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top: 4px solid white; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto;"></div>
            <h2>Loading Section...</h2>
            <p>Please wait while we load the section content.</p>
        </div>
    </div>
    
    <div id="mainContent" style="display: none;">
        <div class="container">
            <div class="section-header">
                <div class="section-title">
                    <i id="sectionIcon" class="fas fa-cogs"></i>
                    <h1 id="sectionName">Section Name</h1>
                </div>
                
                <div style="display:flex; gap:8px;">
                    <button class="back-btn" onclick="goBackToHub()">
                        <i class="fas fa-arrow-left"></i> Back to Hub
                    </button>
                    <button class="back-btn" id="customizeBtn" style="display:none;" onclick="customizeSection()" title="Customize tabs and categories">
                        <i class="fas fa-sliders-h"></i> Customize
                    </button>
                </div>
            </div>

            <div id="sectionIntro" class="section-intro" style="margin:-4px 0 16px 0;color:#556;">
            </div>

            <div class="nav-tabs" id="navTabs"></div>

            <div class="search-filter-container">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search resources..." class="search-input">
                    <i class="fas fa-search search-icon"></i>
                </div>
                <div class="filter-container">
                    <select id="categoryFilter" class="filter-select"></select>
                </div>
            </div>

            <div id="dynamic-sections"></div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <i class="fas fa-folder-open"></i>
                <h3>No resources found</h3>
                <p>Add your first resource to get started!</p>
            </div>
        </div>
    </div>

    <!-- <script src="database.js" defer></script> -->
    <!-- <script src="githubData.js" defer></script> -->
    <script src="auth-script.js" defer></script>
    <script>
        // Bootstrap Supabase keys from meta if globals are empty
        (function(){
            try {
                var metaUrl = (document.querySelector('meta[name="supabase-url"]')||{}).content || '';
                var metaKey = (document.querySelector('meta[name="supabase-anon-key"]')||{}).content || '';
                window.SUPABASE_URL = window.SUPABASE_URL || metaUrl || '';
                window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || metaKey || '';
            } catch(_) {}
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
        (function(){
            function ensureKeys(){
                try {
                    var metaUrl = (document.querySelector('meta[name="supabase-url"]')||{}).content || '';
                    var metaKey = (document.querySelector('meta[name="supabase-anon-key"]')||{}).content || '';
                    window.SUPABASE_URL = window.SUPABASE_URL || metaUrl || '';
                    window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || metaKey || '';
                } catch(_) {}
            }
            function initClient(){
                ensureKeys();
                try {
                    if (window.supabase && !window.supabaseClient && window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
                        window.supabaseClient = window.supabase.createClient(
                            window.SUPABASE_URL,
                            window.SUPABASE_ANON_KEY,
                            { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
                        );
                        (async function setSessionFromUrl(){
                            try {
                                const u = new URL(window.location.href);
                                const at = u.searchParams.get('access_token');
                                const rt = u.searchParams.get('refresh_token');
                                const tt = u.searchParams.get('token_type');
                                if (at && rt && window.supabaseClient && window.supabaseClient.auth && window.supabaseClient.auth.setSession) {
                                    await window.supabaseClient.auth.setSession({ access_token: at, refresh_token: rt, token_type: tt || 'bearer' });
                                    u.searchParams.delete('access_token');
                                    u.searchParams.delete('refresh_token');
                                    u.searchParams.delete('token_type');
                                    history.replaceState({}, document.title, u.toString());
                                }
                            } catch(_) {}
                        })();
                        // Reveal UI early to avoid spinner hang
                        try {
                            const loadingEl = document.getElementById('loadingScreen');
                            const contentEl = document.getElementById('mainContent');
                            if (loadingEl) loadingEl.style.display = 'none';
                            if (contentEl) contentEl.style.display = 'block';
                        } catch(_) {}
                    }
                } catch (e) { console.warn('Supabase init (section) failed', e); }
            }
            if (!(window.supabase && window.supabase.createClient)) { console.error('Supabase library not available'); } else { initClient(); }
        })();
    </script>
    <script src="database-supabase.js" defer></script>
    <script src="section-script.js" defer></script>
    <script>
        // Early failsafe: ensure UI becomes visible and minimally hydrated even if optional flows stall
        setTimeout(() => {
            try {
                const loading = document.getElementById('loadingScreen');
                const content = document.getElementById('mainContent');
                if (loading && getComputedStyle(loading).display !== 'none') {
                    loading.style.display = 'none';
                    if (content) content.style.display = 'block';
                    (async () => {
                        try {
                            const sid = new URLSearchParams(location.search).get('section');
                            if (sid && window.supabaseClient) {
                                const { data } = await window.supabaseClient
                                    .from('sections')
                                    .select('name, icon, config')
                                    .eq('section_id', sid)
                                    .single();
                                if (data) {
                                    const nameEl = document.getElementById('sectionName');
                                    const iconEl = document.getElementById('sectionIcon');
                                    if (nameEl) nameEl.textContent = (data.name || sid);
                                    if (iconEl) iconEl.className = (data.icon || 'fa-solid fa-table-cells-large');
                                    // If tabs are empty, show a gentle message
                                    const tabs = document.getElementById('navTabs');
                                    const dyn = document.getElementById('dynamic-sections');
                                    if (tabs && (!tabs.innerHTML || !tabs.innerHTML.trim())) tabs.innerHTML = '';
                                    if (dyn && (!dyn.innerHTML || !dyn.innerHTML.trim())) {
                                        dyn.innerHTML = '<div class="content-blank" style="padding:24px; text-align:center; color:#666;">Loading content…</div>';
                                    }
                                }
                            }
                        } catch(_) {}
                    })();
                }
            } catch(_) {}
        }, 2500);
    </script>
    
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
