    <style>
        /* CRITICAL: Nuclear option - hide EVERYTHING except loading screen */
        body.initial-loading {
            overflow: hidden !important;
        }
        
        body.initial-loading > *:not(#loadingScreen) {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }
        
        /* Ensure loading screen is ALWAYS visible and on top */
        body.initial-loading #loadingScreen {
            display: flex !important;
            visibility: visible !important;
            opacity: 1 !important;
            z-index: 99999 !important;
        }
        
        /* Block mainContent and all its children aggressively */
        body.initial-loading #mainContent,
        body.initial-loading #mainContent *,
        body.initial-loading .container,
        body.initial-loading .resource-card,
        body.initial-loading [class*="tab"],
        body.initial-loading [class*="resource"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }
    </style>
</head>
<body class="initial-loading">
    <script>
        // IMMEDIATE: Clear any cached content in the DOM before anything renders
        (function() {
            try {
                const clearCached = () => {
                    const resources = document.querySelectorAll('.resource-card, [data-resource-id]');
                    resources.forEach(el => {
                        el.style.display = 'none';
                        el.style.visibility = 'hidden';
                    });
                };
                clearCached();
                setTimeout(clearCached, 1);
            } catch(e) {
                console.error('[Instant Clear] Error:', e);
            }
        })();
    </script>
    
    <!-- INSTANT blocking overlay - covers everything immediately -->
    <div id="instantBlocker" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); z-index: 999999;"></div>
    
    <div id="loadingScreen" style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; position: fixed; top: 0; left: 0; width: 100%; z-index: 9999;">
        <div style="text-align: center; max-width: 400px; padding: 0 20px;">
            <div style="border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top: 4px solid white; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto;"></div>
            <h2 id="sectionLoadingTitle" style="margin: 20px 0 10px;">Loading Section...</h2>
            <p id="sectionLoadingMessage" style="margin: 10px 0; opacity: 0.9;">Initializing...</p>
            <div style="width: 100%; background: rgba(255,255,255,0.2); border-radius: 10px; height: 8px; margin: 20px auto; overflow: hidden;">
                <div id="sectionLoadingBar" style="width: 10%; height: 100%; background: white; border-radius: 10px; transition: width 0.3s ease;"></div>
            </div>
            <p style="font-size: 12px; opacity: 0.7; margin-top: 10px;">Loading fresh data from database...</p>
        </div>
    </div>
    
    <div id="mainContent" style="display: none;">
        <div class="container">
            <div class="section-header">
                <div class="section-title">
                    <i id="sectionIcon" class="fas fa-cogs"></i>
                    <h1 id="sectionName">Section Name</h1>
                </div>
                
                <div style="display:flex; gap:8px;">
                    <button class="back-btn" onclick="goBackToHub()">
                        <i class="fas fa-arrow-left"></i> Back to Hub
                    </button>
                    <button class="back-btn" id="customizeBtn" style="display:none;" onclick="customizeSection()" title="Customize tabs and categories">
                        <i class="fas fa-sliders-h"></i> Customize
                    </button>
                </div>
            </div>

            <div id="sectionIntro" class="section-intro" style="margin:-4px 0 16px 0;color:#556;">
            </div>

            <div class="nav-tabs" id="navTabs"></div>

            <div class="search-filter-container">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search resources..." class="search-input">
                    <i class="fas fa-search search-icon"></i>
                </div>
                <div class="filter-container">
                    <select id="categoryFilter" class="filter-select"></select>
                </div>
            </div>

            <div id="dynamic-sections"></div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <i class="fas fa-folder-open"></i>
                <h3>No resources found</h3>
                <p>Add your first resource to get started!</p>
            </div>
        </div>
    </div>

    <!-- <script src="database.js" defer></script> -->
    <!-- <script src="githubData.js" defer></script> -->
    <script src="auth-script.js" defer></script>
    <script>
        // Bootstrap Supabase keys from meta if globals are empty
        (function(){
            try {
                var metaUrl = (document.querySelector('meta[name="supabase-url"]')||{}).content || '';
                var metaKey = (document.querySelector('meta[name="supabase-anon-key"]')||{}).content || '';
                window.SUPABASE_URL = window.SUPABASE_URL || metaUrl || '';
                window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || metaKey || '';
            } catch(_) {}
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
        (function(){
            function ensureKeys(){
                try {
                    var metaUrl = (document.querySelector('meta[name="supabase-url"]')||{}).content || '';
                    var metaKey = (document.querySelector('meta[name="supabase-anon-key"]')||{}).content || '';
                    window.SUPABASE_URL = window.SUPABASE_URL || metaUrl || '';
                    window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || metaKey || '';
                } catch(_) {}
            }
            function initClient(){
                ensureKeys();
                try {
                    if (window.supabase && !window.supabaseClient && window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
                        window.supabaseClient = window.supabase.createClient(
                            window.SUPABASE_URL,
                            window.SUPABASE_ANON_KEY,
                            { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
                        );
                        (async function setSessionFromUrl(){
                            try {
                                const u = new URL(window.location.href);
                                const at = u.searchParams.get('access_token');
                                const rt = u.searchParams.get('refresh_token');
                                const tt = u.searchParams.get('token_type');
                                if (at && rt && window.supabaseClient && window.supabaseClient.auth && window.supabaseClient.auth.setSession) {
                                    await window.supabaseClient.auth.setSession({ access_token: at, refresh_token: rt, token_type: tt || 'bearer' });
                                    u.searchParams.delete('access_token');
                                    u.searchParams.delete('refresh_token');
                                    u.searchParams.delete('token_type');
                                    history.replaceState({}, document.title, u.toString());
                                }
                            } catch(_) {}
                        })();
                        // Keep loading screen visible - section-script.js will hide it when data is ready
                        window.updateSectionLoadingProgress('Initializing...', 20);
                    }
                } catch (e) { 
                    console.warn('Supabase init (section) failed', e);
                    window.updateSectionLoadingProgress('Connection issue...', 30);
                }
            }
            if (!(window.supabase && window.supabase.createClient)) { console.error('Supabase library not available'); } else { initClient(); }
        })();
    </script>
    <script src="database-supabase.js" defer></script>
    <script src="section-script.js" defer></script>
    <script>
        // Helper function to update section loading progress
        window.updateSectionLoadingProgress = function(message, progress) {
            try {
                const loadingMessage = document.getElementById('sectionLoadingMessage');
                const loadingBar = document.getElementById('sectionLoadingBar');
                if (loadingMessage && message) {
                    loadingMessage.textContent = message;
                    console.log('[Section Loading]', message, progress ? `(${progress}%)` : '');
                }
                if (loadingBar && typeof progress === 'number') {
                    loadingBar.style.width = Math.min(100, Math.max(0, progress)) + '%';
                }
            } catch (_) {}
        };
        
        // Early failsafe: ensure UI becomes visible if loading takes too long (10 seconds)
        setTimeout(() => {
            try {
                const loading = document.getElementById('loadingScreen');
                const content = document.getElementById('mainContent');
                if (loading && getComputedStyle(loading).display !== 'none') {
                    console.warn('[Section] Loading took too long, showing content anyway');
                    // Remove CSS blocking class on failsafe timeout
                    try {
                        document.body.classList.remove('initial-loading');
                        const blocker = document.getElementById('instantBlocker');
                        if (blocker) blocker.remove();
                        console.log('[Section Failsafe] Removed initial-loading class');
                    } catch (_) {}
                    loading.style.transition = 'opacity 0.3s ease-out';
                    loading.style.opacity = '0';
                    setTimeout(() => {
                        loading.style.display = 'none';
                    }, 300);
                    if (content) {
                        content.style.display = 'block';
                        content.style.opacity = '0';
                        content.style.transition = 'opacity 0.3s ease-in';
                        setTimeout(() => {
                            content.style.opacity = '1';
                        }, 50);
                    }
                    (async () => {
                        try {
                            const sid = new URLSearchParams(location.search).get('section');
                            if (sid && window.supabaseClient) {
                                const { data } = await window.supabaseClient
                                    .from('sections')
                                    .select('name, icon, config')
                                    .eq('section_id', sid)
                                    .single();
                                if (data) {
                                    const nameEl = document.getElementById('sectionName');
                                    const iconEl = document.getElementById('sectionIcon');
                                    if (nameEl) nameEl.textContent = (data.name || sid);
                                    if (iconEl) iconEl.className = (data.icon || 'fa-solid fa-table-cells-large');
                                    // If tabs are empty, show a gentle message
                                    const tabs = document.getElementById('navTabs');
                                    const dyn = document.getElementById('dynamic-sections');
                                    if (tabs && (!tabs.innerHTML || !tabs.innerHTML.trim())) tabs.innerHTML = '';
                                    if (dyn && (!dyn.innerHTML || !dyn.innerHTML.trim())) {
                                        dyn.innerHTML = '<div class="content-blank" style="padding:24px; text-align:center; color:#666;">Loading content…</div>';
                                    }
                                }
                            }
                        } catch(_) {}
                    })();
                }
            } catch(_) {}
        }, 2500);
    </script>
    
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
