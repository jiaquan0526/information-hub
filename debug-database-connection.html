<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Database Connection</title>
    <meta name="supabase-url" content="https://pioubcszuayewepdawzt.supabase.co">
    <meta name="supabase-anon-key" content="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpb3ViY3N6dWF5ZXdlcGRhd3p0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1NDU1MjIsImV4cCI6MjA3NDEyMTUyMn0.-L-vDiKP2xh18OMgBoBQ8mruzVGXhWvMdvxJg9mjY9k">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .debug-section { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 4px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .info { color: blue; }
        .button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        .button:hover { background: #0056b3; }
        pre { background: #f1f1f1; padding: 10px; border-radius: 4px; overflow-x: auto; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .status.loading { background: #fff3cd; color: #856404; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🔍 Debug Database Connection</h1>
    
    <div class="debug-section">
        <h3>Step 1: Test Direct Supabase Connection</h3>
        <button class="button" onclick="testDirectSupabase()">Test Direct Supabase</button>
        <div id="directSupabaseResult"></div>
    </div>
    
    <div class="debug-section">
        <h3>Step 2: Test Database.js Loading</h3>
        <button class="button" onclick="testDatabaseJs()">Test Database.js</button>
        <div id="databaseJsResult"></div>
    </div>
    
    <div class="debug-section">
        <h3>Step 3: Test hubDatabase Object</h3>
        <button class="button" onclick="testHubDatabase()">Test hubDatabase</button>
        <div id="hubDatabaseResult"></div>
    </div>
    
    <div class="debug-section">
        <h3>Step 4: Test Section Loading</h3>
        <button class="button" onclick="testSectionLoading()">Test Section Loading</button>
        <div id="sectionLoadingResult"></div>
    </div>
    
    <div class="debug-section">
        <h3>Step 5: Test User Authentication</h3>
        <button class="button" onclick="testUserAuth()">Test User Auth</button>
        <div id="userAuthResult"></div>
    </div>
    
    <script>
        const SUPABASE_URL = 'https://pioubcszuayewepdawzt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpb3ViY3N6dWF5ZXdlcGRhd3p0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1NDU1MjIsImV4cCI6MjA3NDEyMTUyMn0.-L-vDiKP2xh18OMgBoBQ8mruzVGXhWvMdvxJg9mjY9k';
        
        let supabaseClient = null;
        
        async function initSupabase() {
            try {
                if (!window.supabase) {
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
                    await new Promise((resolve, reject) => {
                        script.onload = resolve;
                        script.onerror = reject;
                        document.head.appendChild(script);
                    });
                }
                
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                return true;
            } catch (error) {
                console.error('Failed to initialize Supabase:', error);
                return false;
            }
        }
        
        async function testDirectSupabase() {
            const resultDiv = document.getElementById('directSupabaseResult');
            resultDiv.innerHTML = '<div class="status loading">🔄 Testing direct Supabase connection...</div>';
            
            try {
                if (!supabaseClient) {
                    const success = await initSupabase();
                    if (!success) {
                        resultDiv.innerHTML = '<div class="status error">❌ Failed to initialize Supabase</div>';
                        return;
                    }
                }
                
                // Test basic connection
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('count')
                    .limit(1);
                
                if (error) {
                    resultDiv.innerHTML = '<div class="status error">❌ Supabase error: ' + error.message + '</div>';
                } else {
                    resultDiv.innerHTML = '<div class="status success">✅ Direct Supabase connection successful!</div>';
                }
                
            } catch (error) {
                resultDiv.innerHTML = '<div class="status error">❌ Connection error: ' + error.message + '</div>';
            }
        }
        
        function testDatabaseJs() {
            const resultDiv = document.getElementById('databaseJsResult');
            resultDiv.innerHTML = '<div class="status loading">🔄 Testing database.js loading...</div>';
            
            try {
                if (typeof window.hubDatabase === 'undefined') {
                    resultDiv.innerHTML = '<div class="status error">❌ hubDatabase not defined</div>';
                    return;
                }
                
                if (typeof window.hubDatabaseReady === 'undefined') {
                    resultDiv.innerHTML = '<div class="status error">❌ hubDatabaseReady not defined</div>';
                    return;
                }
                
                resultDiv.innerHTML = '<div class="status success">✅ hubDatabase and hubDatabaseReady are defined</div>';
                resultDiv.innerHTML += '<div class="info">hubDatabaseReady: ' + window.hubDatabaseReady + '</div>';
                resultDiv.innerHTML += '<div class="info">hubDatabase methods: ' + Object.keys(window.hubDatabase).join(', ') + '</div>';
                
            } catch (error) {
                resultDiv.innerHTML = '<div class="status error">❌ Error: ' + error.message + '</div>';
            }
        }
        
        async function testHubDatabase() {
            const resultDiv = document.getElementById('hubDatabaseResult');
            resultDiv.innerHTML = '<div class="status loading">🔄 Testing hubDatabase functionality...</div>';
            
            try {
                if (!window.hubDatabase || !window.hubDatabaseReady) {
                    resultDiv.innerHTML = '<div class="status error">❌ hubDatabase not ready</div>';
                    return;
                }
                
                if (typeof window.hubDatabase.getAllSections !== 'function') {
                    resultDiv.innerHTML = '<div class="status error">❌ getAllSections method not available</div>';
                    return;
                }
                
                const sections = await window.hubDatabase.getAllSections();
                resultDiv.innerHTML = '<div class="status success">✅ hubDatabase.getAllSections() works!</div>';
                resultDiv.innerHTML += '<div class="info">Found ' + sections.length + ' sections</div>';
                resultDiv.innerHTML += '<pre>' + JSON.stringify(sections, null, 2) + '</pre>';
                
            } catch (error) {
                resultDiv.innerHTML = '<div class="status error">❌ hubDatabase error: ' + error.message + '</div>';
            }
        }
        
        async function testSectionLoading() {
            const resultDiv = document.getElementById('sectionLoadingResult');
            resultDiv.innerHTML = '<div class="status loading">🔄 Testing section loading process...</div>';
            
            try {
                // Simulate the exact process from updateMainHubSections
                let visibleSections = [];
                let databaseLoaded = false;
                
                // Wait for database to be ready (with retry)
                let retries = 0;
                const maxRetries = 20;
                while (retries < maxRetries && (!window.hubDatabase || !window.hubDatabaseReady)) {
                    console.log('Waiting for database to be ready...', retries + 1);
                    await new Promise(resolve => setTimeout(resolve, 200));
                    retries++;
                }
                
                if (window.hubDatabase && window.hubDatabaseReady && typeof hubDatabase.getAllSections === 'function') {
                    console.log('Loading sections from Supabase database...');
                    const sections = await hubDatabase.getAllSections();
                    console.log('Loaded sections from database:', sections);
                    
                    if (sections && sections.length > 0) {
                        databaseLoaded = true;
                        visibleSections = sections.filter(s => s.visible !== false).sort((a,b) => (a.order||0)-(b.order||0));
                    }
                }
                
                if (databaseLoaded && visibleSections.length > 0) {
                    resultDiv.innerHTML = '<div class="status success">✅ Section loading successful!</div>';
                    resultDiv.innerHTML += '<div class="info">Database loaded: ' + databaseLoaded + '</div>';
                    resultDiv.innerHTML += '<div class="info">Visible sections: ' + visibleSections.length + '</div>';
                    resultDiv.innerHTML += '<pre>' + JSON.stringify(visibleSections, null, 2) + '</pre>';
                } else {
                    resultDiv.innerHTML = '<div class="status error">❌ Section loading failed</div>';
                    resultDiv.innerHTML += '<div class="info">Database loaded: ' + databaseLoaded + '</div>';
                    resultDiv.innerHTML += '<div class="info">Visible sections: ' + visibleSections.length + '</div>';
                }
                
            } catch (error) {
                resultDiv.innerHTML = '<div class="status error">❌ Error: ' + error.message + '</div>';
            }
        }
        
        async function testUserAuth() {
            const resultDiv = document.getElementById('userAuthResult');
            resultDiv.innerHTML = '<div class="status loading">🔄 Testing user authentication...</div>';
            
            try {
                const sessionRaw = localStorage.getItem('hubSession');
                if (!sessionRaw) {
                    resultDiv.innerHTML = '<div class="status info">ℹ️ No user logged in</div>';
                    return;
                }
                
                const user = JSON.parse(sessionRaw);
                resultDiv.innerHTML = '<div class="status success">✅ User logged in</div>';
                resultDiv.innerHTML += '<div class="info">Username: ' + user.username + '</div>';
                resultDiv.innerHTML += '<div class="info">Role: ' + user.role + '</div>';
                resultDiv.innerHTML += '<div class="info">Permissions: ' + JSON.stringify(user.permissions, null, 2) + '</div>';
                
            } catch (error) {
                resultDiv.innerHTML = '<div class="status error">❌ Auth error: ' + error.message + '</div>';
            }
        }
        
        // Auto-run tests on page load
        window.addEventListener('load', () => {
            setTimeout(() => {
                testDatabaseJs();
            }, 1000);
        });
    </script>
</body>
</html>
